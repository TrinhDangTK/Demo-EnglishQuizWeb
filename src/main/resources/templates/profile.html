<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{_layout :: head('Profile')}"></head>
<body>

<nav th:replace="~{_layout :: navbar}"></nav>

<div class="page-wrapper auth-wrapper">
  <div class="auth-card profile-card">
    <h1 class="page-title">Profile</h1>
    <p class="page-sub">Update your display name, email, and optionally change your password.</p>

    <div class="profile-tier-section">
      <span class="profile-tier-label">Account Tier:</span>
      <span th:if="${isVip}" class="tier-badge tier-badge--vip">👑 VIP</span>
      <span th:unless="${isVip}" class="tier-badge tier-badge--normal">Normal</span>
      <a th:unless="${isVip}" th:href="@{/upgrade}" class="btn btn-sm btn-upgrade-mini">⚡ Upgrade to VIP</a>
    </div>

    <div class="alert alert-error" th:if="${error}" th:text="${error}">Error</div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}">Success</div>

    <form th:action="@{/profile}" method="post" class="auth-form">
      <label for="username">Username</label>
      <input id="username" type="text" th:value="${username}" disabled class="input-muted"/>

      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" type="text" maxlength="120" th:value="${fullName}" placeholder="Optional"/>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" maxlength="255" th:value="${email}" placeholder="Optional"/>

      <p class="profile-section-label">Change password</p>
      <p class="profile-section-hint">Leave blank to keep your current password.</p>

      <label for="currentPassword">Current password</label>
      <div class="password-wrap">
        <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password"/>
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <label for="newPassword">New password</label>
      <div class="password-wrap">
        <input id="newPassword" name="newPassword" type="password" minlength="6" autocomplete="new-password"/>
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <label for="confirmPassword">Confirm new password</label>
      <div class="password-wrap">
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="6" autocomplete="new-password"/>
        <button type="button" class="password-toggle" aria-label="Show password" title="Show password">
          <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
          <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn btn-primary">Save changes</button>
    </form>
  </div>
</div>

</body>
</html>
